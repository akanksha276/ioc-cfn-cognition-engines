# agent_configs.yaml
#
# Defines LLM agent personas for test_via_semantic_neg_agents.py.
#
# Structure
# ---------
# default_agents:    used for any mission that does NOT declare its own agents
#                    (e.g., all hard5 missions).
#
# mission_agents:    keyed by mission name slug (lowercase, underscores).
#                    When a mission matches, these agents replace the defaults.
#
# Per-agent fields
# ----------------
#   id             : participant_id sent to the neg server (must be unique per run)
#   name           : display name (logged and shown in dialogue traces)
#   persona_file   : path to a YAML file (relative to this file) containing the
#                    agent's persona under the key "persona".
#                    Inline "persona:" is still accepted as a fallback.

# ─────────────────────────────────────────────────────────────────────────────
# Default agents — used for hard5 and any mission without explicit agents
# ─────────────────────────────────────────────────────────────────────────────
default_agents:
  - id: agent-a
    name: Agent A
    persona_file: personas/profiles/default/agent_a.yaml

  - id: agent-b
    name: Agent B
    persona_file: personas/profiles/default/agent_b.yaml

  - id: agent-c
    name: Agent C
    persona_file: personas/profiles/default/agent_c.yaml

# ─────────────────────────────────────────────────────────────────────────────
# Example use-case mission-specific agents
# Keys must match the slug of the mission name:
#   slug = lowercase, spaces/punctuation → underscores, leading/trailing _ stripped
# ─────────────────────────────────────────────────────────────────────────────
